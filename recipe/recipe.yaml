schema_version: 1

context:
  version: "26.4"
  python_min: "3.10"

package:
  name: packaging
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/packaging/packaging-${{ version }}.tar.gz
  sha256: c4b671c41ddb9bf26e543c37723610d28fb6bf7affc4da17cf048d419d2c062a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    # conda-forge's pip prior to Python 3.13 depends on wheel, which depends on
    # packaging, so using pip for python_min older than 3.13 would put an older
    # packaging in host and the new install would clobber it, leaving its files
    # out of the package. Until packaging has requires-python of >= 3.13
    # manually force python 3.13 as the host Python.
    # See https://conda-forge.org/news/2024/08/21/sunsetting-pip-deps/
    # - python ${{ python_min }}.*
    - python 3.13.*
    - flit-core >=3.12
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - packaging
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Core utilities for Python packages
  homepage: https://github.com/pypa/packaging
  repository: https://github.com/pypa/packaging
  documentation: https://packaging.pypa.io/

extra:
  recipe-maintainers:
    - jakirkham
    - nicoddemus
    - matthewfeickert
    - ofek
