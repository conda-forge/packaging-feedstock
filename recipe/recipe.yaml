schema_version: 1

context:
  version: "26.4"
  python_min: "3.10"

package:
  name: packaging
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/packaging/packaging-${{ version }}.tar.gz
  sha256: c4b671c41ddb9bf26e543c37723610d28fb6bf7affc4da17cf048d419d2c062a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.12
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - packaging
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Core utilities for Python packages
  homepage: https://github.com/pypa/packaging
  repository: https://github.com/pypa/packaging
  documentation: https://packaging.pypa.io/

extra:
  recipe-maintainers:
    - jakirkham
    - nicoddemus
    - matthewfeickert
    - ofek
